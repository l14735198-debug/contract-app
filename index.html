<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سامانه مدیریت قرارداد</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, Arial, sans-serif; background: #f0f4f8; margin: 0; padding: 20px; direction: rtl; }
  .container { max-width: 900px; margin: 0 auto; }
  .card { background: #fff; border-radius: 12px; padding: 25px; margin-bottom: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h1 { color: #1a237e; font-size: 1.2rem; margin: 0 0 20px; }
  h2 { color: #1a237e; font-size: 1.05rem; margin: 0 0 15px; }
  .header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; padding-bottom: 15px; border-bottom: 2px solid #e8eaf6; }
  label { display: block; margin-bottom: 6px; color: #555; font-size: 0.9rem; font-weight: bold; }
  input[type=text], input[type=number], input[type=date], textarea {
    width: 100%; padding: 10px 12px; border: 2px solid #e0e0e0; border-radius: 8px;
    font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s;
  }
  input:focus, textarea:focus { outline: none; border-color: #1a237e; }
  textarea { min-height: 240px; resize: vertical; line-height: 1.9; }
  .form-group { margin-bottom: 15px; }
  .btn {
    padding: 12px 24px; background: #1a237e; color: #fff; border: none; border-radius: 8px;
    font-family: inherit; font-size: 0.95rem; cursor: pointer; transition: background 0.2s;
  }
  .btn:hover { background: #0d1657; }
  .btn-secondary { background: #e0e0e0; color: #333; }
  .btn-secondary:hover { background: #ccc; }
  .btn-fp { background: #e3f2fd; color: #0d47a1; border: 2px solid #0d47a1; }
  .btn-fp.verified { background: #c8e6c9; border-color: #2e7d32; color: #1b5e20; }
  .btn-row { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .hint { background: #e3f2fd; border-right: 4px solid #1a237e; padding: 12px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 15px; line-height: 1.9; }
  .hint code { background: #fff; padding: 2px 6px; border-radius: 4px; color: #c62828; font-family: monospace; direction: ltr; display: inline-block; }
  .contract-view { background: #fafafa; border: 1px solid #eee; border-radius: 10px; padding: 20px; line-height: 2.2; font-size: 0.95rem; white-space: pre-wrap; }
  .ph-filled { background: #fff8e1; color: #e65100; padding: 1px 6px; border-radius: 4px; font-weight: bold; }
  .ph-empty { background: #ffebee; color: #c62828; padding: 1px 6px; border-radius: 4px; font-size: 0.85rem; }
  .ph-check { font-size: 1.3rem; vertical-align: middle; }
  .sig-img { max-height: 70px; max-width: 180px; vertical-align: middle; }
  .links-box { background: #e8f5e9; border-radius: 10px; padding: 15px; margin-top: 15px; word-break: break-all; display: none; }
  .links-box.show { display: block; }
  .links-box a { color: #1b5e20; display: block; margin: 6px 0; padding: 8px; background: #fff; border-radius: 6px; text-decoration: none; }
  .links-box .lbl { font-weight: bold; color: #1b5e20; margin-top: 10px; font-size: 0.9rem; }
  .status-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; }
  .st-pending { background: #fff3e0; color: #e65100; }
  .st-partial { background: #e3f2fd; color: #0d47a1; }
  .st-signed { background: #c8e6c9; color: #1b5e20; }
  canvas { border: 2px dashed #ccc; border-radius: 8px; width: 100%; height: 150px; touch-action: none; background: #fff; display: block; }
  .msg { padding: 12px; border-radius: 8px; margin-top: 15px; display: none; }
  .msg.show { display: block; }
  .msg-ok { background: #e8f5e9; color: #1b5e20; }
  .msg-err { background: #ffebee; color: #c62828; }
  .msg-info { background: #e3f2fd; color: #0d47a1; }
  .party-badge { display: inline-block; background: #1a237e; color: #fff; padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; margin-bottom: 15px; }
  .demo-badge { background: #fff3e0; color: #e65100; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; margin-bottom: 15px; text-align: center; }
  .list-row { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .list-row a { color: #1a237e; text-decoration: none; font-size: 0.9rem; }
  .footer { text-align: center; color: #999; font-size: 0.75rem; margin-top: 20px; }
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ═══════════════════════════════════════════
   ۱. تنظیمات
   ═══════════════════════════════════════════ */
const SUPABASE_URL = '';   // مثلاً 'https://xxxx.supabase.co'
const SUPABASE_KEY = '';   // anon public key
const USE_SUPABASE = SUPABASE_URL.startsWith('https://') && SUPABASE_KEY.length > 20;

let sb = null;
if (USE_SUPABASE) {
  const s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload = () => { sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY); };
  document.head.appendChild(s);
}

/* ═══════════════════════════════════════════
   ۲. لایه ذخیره‌سازی
   ═══════════════════════════════════════════ */
const store = {
  async create(rec) {
    if (USE_SUPABASE && sb) {
      const { data, error } = await sb.from('contracts').insert([rec]).select().single();
      if (error) throw error; return data;
    }
    const id = 'L' + Math.random().toString(36).slice(2, 10);
    const full = { id, ...rec, created_at: new Date().toISOString() };
    localStorage.setItem('contract_' + id, JSON.stringify(full));
    return full;
  },
  async get(id) {
    if (USE_SUPABASE && sb) {
      const { data, error } = await sb.from('contracts').select('*').eq('id', id).single();
      if (error) throw error; return data;
    }
    const raw = localStorage.getItem('contract_' + id);
    return raw ? JSON.parse(raw) : null;
  },
  async update(id, patch) {
    if (USE_SUPABASE && sb) {
      const { error } = await sb.from('contracts').update(patch).eq('id', id);
      if (error) throw error; return;
    }
    const ex = JSON.parse(localStorage.getItem('contract_' + id) || '{}');
    localStorage.setItem('contract_' + id, JSON.stringify({ ...ex, ...patch }));
  },
  async list() {
    if (USE_SUPABASE && sb) {
      const { data } = await sb.from('contracts').select('id,status,created_at').order('created_at', { ascending: false }).limit(20);
      return data || [];
    }
    const out = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k.startsWith('contract_')) {
        try { const c = JSON.parse(localStorage.getItem(k)); out.push({ id: c.id, status: c.status, created_at: c.created_at }); } catch (e) {}
      }
    }
    return out.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));
  }
};

/* ═══════════════════════════════════════════
   ۳. نگهدارنده‌ها (Placeholders)
   ═══════════════════════════════════════════ */
const PH_RE = /\{\{([a-zA-Z0-9_]+)(?::([^}|]+))?(?:\|([a-zA-Z]+))?\}\}/g;

function parseFields(template) {
  const list = [], seen = new Set();
  let m; PH_RE.lastIndex = 0;
  while ((m = PH_RE.exec(template)) !== null) {
    const [, name, label, type] = m;
    if (seen.has(name)) continue; seen.add(name);
    if (name === 'a_signature' || name === 'b_signature') continue;
    list.push({ name, label: label || name, type: type || 'text' });
  }
  return list;
}
function groupFields(fields) {
  const g = { admin: [], a: [], b: [] };
  for (const f of fields) {
    if (f.name.startsWith('a_')) g.a.push(f);
    else if (f.name.startsWith('b_')) g.b.push(f);
    else g.admin.push(f);
  }
  return g;
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function renderTemplate(template, values, opts = {}) {
  return template.replace(/\{\{([a-zA-Z0-9_]+)(?::([^}|]+))?(?:\|([a-zA-Z]+))?\}\}/g, (full, name, label, type) => {
    const val = values[name];
    if (type === 'checkbox') return `<span class="ph-check">${val ? '☑' : '☐'}</span>`;
    if (name === 'a_signature') return opts.sigA ? `<img src="${opts.sigA}" class="sig-img" alt="امضای الف">` : '<span class="ph-empty">[امضای طرف الف]</span>';
    if (name === 'b_signature') return opts.sigB ? `<img src="${opts.sigB}" class="sig-img" alt="امضای ب">` : '<span class="ph-empty">[امضای طرف ب]</span>';
    return (val !== undefined && val !== null && val !== '')
      ? `<span class="ph-filled">${esc(val)}</span>`
      : `<span class="ph-empty">[${esc(label || name)}]</span>`;
  });
}

/* ═══════════════════════════════════════════
   ۴. پنل مدیر
   ═══════════════════════════════════════════ */
async function renderAdmin() {
  document.title = 'پنل مدیر - سامانه قرارداد';
  document.getElementById('app').innerHTML = `
    <div class="container">
      ${!USE_SUPABASE ? '<div class="demo-badge">⚠️ حالت آزمایشی: داده‌ها فقط روی همین مرورگر ذخیره می‌شوند. برای ارسال لینک به طرف مقابل، Supabase را در بالای کد وصل کنید.</div>' : ''}
      <div class="card">
        <div class="header"><h1>📝 ساخت قرارداد جدید</h1></div>
        <div class="hint">
          <strong>نگهدارنده‌ها:</strong><br>
          طرف الف: <code>{{a_name}}</code>، <code>{{a_id}}</code><br>
          طرف ب: <code>{{b_name}}</code>، <code>{{b_id}}</code><br>
          ثابت (مدیر): <code>{{amount}}</code>، <code>{{duration}}</code><br>
          نوع: <code>{{amount|number}}</code> — <code>{{date|date}}</code> — <code>{{a_agree|checkbox}}</code><br>
          امضا: <code>{{a_signature}}</code> و <code>{{b_signature}}</code>
        </div>
        <div class="form-group">
          <label>متن قرارداد</label>
          <textarea id="template"></textarea>
        </div>
        <div id="fixedFields"></div>
        <div class="btn-row"><button class="btn" onclick="createContract()">🔗 ساخت قرارداد و لینک‌ها</button></div>
        <div class="links-box" id="linksBox"></div>
      </div>
      <div class="card">
        <h2>📋 قراردادهای اخیر</h2>
        <div id="contractList">در حال بارگذاری...</div>
      </div>
      <div class="footer">سامانه نمونه — برای مقاصد آموزشی</div>
    </div>
  `;

  const t = document.getElementById('template');
  t.value = `قرارداد صلح

اینجانب {{a_name}} فرزند {{a_father}} به کد ملی {{a_id}} (طرف الف) و اینجانب {{b_name}} فرزند {{b_father}} به کد ملی {{b_id}} (طرف ب) با توافق یکدیگر مقرر نمودیم:

طرف الف متعهد می‌شود ماهیانه مبلغ {{amount|number}} تومان به طرف ب پرداخت نماید.

مدت قرارداد: {{duration|number}} ماه از تاریخ {{startDate|date}}.

{{a_agree|checkbox}} طرف الف: کلیه شروط فوق را می‌پذیرم.
{{b_agree|checkbox}} طرف ب: کلیه شروط فوق را می‌پذیرم.

امضای طرف الف: {{a_signature}}
امضای طرف ب: {{b_signature}}`;

  t.addEventListener('input', updateFixedFields);
  updateFixedFields();
  loadContractList();
}

function updateFixedFields() {
  const fields = parseFields(document.getElementById('template').value);
  const g = groupFields(fields);
  const box = document.getElementById('fixedFields');
  if (!g.admin.length) { box.innerHTML = ''; return; }
  let html = '<div class="hint" style="background:#fff3e0;border-color:#e65100;"><strong>فیلدهای ثابت (مدیر پر می‌کند):</strong></div>';
  for (const f of g.admin) {
    const it = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
    html += `<div class="form-group"><label>${esc(f.label)}</label><input type="${it}" data-fixed="${f.name}" placeholder="${esc(f.label)}"></div>`;
  }
  box.innerHTML = html;
}

async function createContract() {
  const template = document.getElementById('template').value.trim();
  if (!template) { alert('متن قرارداد خالی است'); return; }
  const fixed = {};
  document.querySelectorAll('[data-fixed]').forEach(el => {
    fixed[el.getAttribute('data-fixed')] = el.type === 'checkbox' ? el.checked : el.value;
  });

  try {
    const created = await store.create({
      template, fixed, status: 'pending', valuesA: {}, valuesB: {}
    });

    let base = location.origin + location.pathname.replace(/index\.html$/, '');
    if (!base.endsWith('/')) base += '/';

    const linkA = `${base}#sign?id=${created.id}&role=a`;
    const linkB = `${base}#sign?id=${created.id}&role=b`;
    const linkView = `${base}#view?id=${created.id}`;

    document.getElementById('linksBox').innerHTML = `
      <div class="lbl">🔗 لینک امضای طرف الف:</div><a href="${linkA}" target="_blank">${linkA}</a>
      <div class="lbl">🔗 لینک امضای طرف ب:</div><a href="${linkB}" target="_blank">${linkB}</a>
      <div class="lbl">👁️ لینک مشاهده و PDF:</div><a href="${linkView}" target="_blank">${linkView}</a>
    `;
    document.getElementById('linksBox').classList.add('show');
    loadContractList();
  } catch (e) {
    alert('خطا: ' + e.message);
  }
}

async function loadContractList() {
  const box = document.getElementById('contractList');
  if (!box) return;
  let list;
  try { list = await store.list(); } catch (e) { list = []; }
  if (!list.length) { box.innerHTML = '<p style="color:#999;">هنوز قراردادی ساخته نشده.</p>'; return; }
  const map = { pending: 'در انتظار', partial: 'نیمه', signed: 'امضا شده' };
  const cls = { pending: 'st-pending', partial: 'st-partial', signed: 'st-signed' };
  box.innerHTML = list.map(c => `
    <div class="list-row">
      <code style="font-size:0.8rem;">${esc(c.id)}</code>
      <span class="status-badge ${cls[c.status] || 'st-pending'}">${map[c.status] || c.status}</span>
      <a href="#view?id=${c.id}">مشاهده ←</a>
    </div>
  `).join('');
}

/* ═══════════════════════════════════════════
   ۵. صفحه امضا
   ═══════════════════════════════════════════ */
async function renderSign(id, role) {
  document.title = 'امضای قرارداد';
  document.getElementById('app').innerHTML = '<div class="container"><div class="card"><p>در حال بارگذاری...</p></div></div>';

  if (USE_SUPABASE && !sb) await new Promise(r => setTimeout(r, 800));

  let contract = null;
  try { contract = await store.get(id); } catch (e) {}
  if (!contract) {
    document.getElementById('app').innerHTML = '<div class="container"><div class="card"><p style="color:#c62828;">قرارداد یافت نشد. اگر در حالت آزمایشی هستید، لینک فقط روی همان مرورگر کار می‌کند.</p><p><a href="#">بازگشت به پنل</a></p></div></div>';
    return;
  }

  const signedKey = role === 'a' ? 'signedAAt' : 'signedBAt';
  if (contract[signedKey]) {
    document.getElementById('app').innerHTML = `
      <div class="container"><div class="card">
        <h1>✅ شما قبلاً این قرارداد را امضا کرده‌اید.</h1>
        <div class="btn-row"><a class="btn" href="#view?id=${id}">مشاهده قرارداد</a></div>
      </div></div>`;
    return;
  }

  const fields = parseFields(contract.template);
  const g = groupFields(fields);
  const myFields = role === 'a' ? g.a : g.b;
  const roleLabel = role === 'a' ? 'طرف الف' : 'طرف ب';

  let formHtml = '';
  for (const f of myFields) {
    if (f.type === 'checkbox')
      formHtml += `<div class="form-group"><label style="display:flex;align-items:center;gap:8px;font-weight:normal;cursor:pointer;"><input type="checkbox" data-field="${f.name}"> ${esc(f.label)}</label></div>`;
    else {
      const it = f.type === 'number' ? 'number' : f.type === 'date' ? 'date' : 'text';
      formHtml += `<div class="form-group"><label>${esc(f.label)}</label><input type="${it}" data-field="${f.name}" placeholder="${esc(f.label)}"></div>`;
    }
  }

  const combined = { ...(contract.fixed || {}), ...(contract.valuesA || {}), ...(contract.valuesB || {}) };

  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="card">
        <div class="header"><h1>✍️ امضای قرارداد</h1></div>
        <div class="party-badge">شما در نقش: ${roleLabel}</div>
        <div class="contract-view" id="contractView"></div>
      </div>
      <div class="card">
        <h2>تکمیل اطلاعات شما</h2>
        ${formHtml || '<p style="color:#999;">فیلدی برای شما تعریف نشده است.</p>'}
      </div>
      <div class="card">
        <h2>امضا و تأیید</h2>
        <label style="margin-bottom:8px;">امضای خود را روی کادر بکشید:</label>
        <canvas id="sigCanvas"></canvas>
        <div class="btn-row">
          <button class="btn btn-fp" id="fpBtn" onclick="verifyFingerprint()">🖐️ تأیید اثر انگشت</button>
          <button class="btn" onclick="submitSignature('${id}', '${role}')">✅ ثبت نهایی امضا</button>
        </div>
        <div class="msg" id="msg"></div>
      </div>
    </div>
  `;

  window._cur = { contract, role, myFields, combined, myValues: {}, fpVerified: false };
  renderSignPreview();
  initSigCanvas();
}

function renderSignPreview() {
  const { contract, combined, myValues } = window._cur;
  const view = document.getElementById('contractView');
  if (!view) return;
  view.innerHTML = renderTemplate(contract.template, { ...combined, ...myValues }, {
    sigA: contract.sigA, sigB: contract.sigB
  });
}

function initSigCanvas() {
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  function resize() {
    const tmp = canvas.toDataURL();
    canvas.width = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    ctx.lineWidth = 2.5; ctx.lineCap = 'round'; ctx.strokeStyle = '#1a237e';
  }
  window.addEventListener('resize', resize);
  resize();
  canvas.addEventListener('pointerdown', e => { drawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
  canvas.addEventListener('pointermove', e => { if (!drawing) return; ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); });
  canvas.addEventListener('pointerup', () => drawing = false);
  canvas.addEventListener('pointerleave', () => drawing = false);

  document.querySelectorAll('[data-field]').forEach(el => {
    const handler = () => {
      window._cur.myValues[el.getAttribute('data-field')] = el.type === 'checkbox' ? el.checked : el.value;
      renderSignPreview();
    };
    el.addEventListener('input', handler);
    el.addEventListener('change', handler);
  });
}

async function verifyFingerprint() {
  const btn = document.getElementById('fpBtn');
  const msg = document.getElementById('msg');
  msg.className = 'msg show msg-info';
  msg.textContent = 'در حال تأیید اثر انگشت...';
  try {
    const challenge = new Uint8Array(32);
    crypto.getRandomValues(challenge);
    await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name: 'قرارداد' },
        user: { id: new TextEncoder().encode('s-' + Date.now()), name: 'signer', displayName: 'signer' },
        pubKeyCredParams: [{ type: 'public-key', alg: -7 }],
        authenticatorSelection: { authenticatorAttachment: 'platform', userVerification: 'required' },
        timeout: 60000
      }
    });
    window._cur.fpVerified = true;
    btn.classList.add('verified');
    btn.textContent = '✅ اثر انگشت تأیید شد';
    msg.className = 'msg show msg-ok';
    msg.textContent = 'اثر انگشت با موفقیت تأیید شد.';
  } catch (e) {
    msg.className = 'msg show msg-err';
    msg.textContent = 'تأیید اثر انگشت انجام نشد. اگر دستگاه اثر انگشت ندارد، از دستگاه دیگری استفاده کنید.';
  }
}

async function submitSignature(id, role) {
  const msg = document.getElementById('msg');
  if (!window._cur.fpVerified) {
    msg.className = 'msg show msg-err';
    msg.textContent = 'ابتدا اثر انگشت خود را تأیید کنید.';
    return;
  }
  const canvas = document.getElementById('sigCanvas');
  const blank = document.createElement('canvas');
  blank.width = canvas.width; blank.height = canvas.height;
  if (canvas.toDataURL() === blank.toDataURL()) {
    msg.className = 'msg show msg-err';
    msg.textContent = 'امضای خود را روی کادر بکشید.';
    return;
  }
  for (const f of window._cur.myFields) {
    const v = window._cur.myValues[f.name];
    if (f.type === 'checkbox' && !v) { msg.className = 'msg show msg-err'; msg.textContent = `لطفاً تیک «${f.label}» را بزنید.`; return; }
    if (f.type !== 'checkbox' && (!v || !String(v).trim())) { msg.className = 'msg show msg-err'; msg.textContent = `لطفاً «${f.label}» را وارد کنید.`; return; }
  }

  const sigData = canvas.toDataURL('image/png');
  const now = new Date().toISOString();
  const patch = {};
  if (role === 'a') { patch.valuesA = window._cur.myValues; patch.sigA = sigData; patch.signedAAt = now; }
  else { patch.valuesB = window._cur.myValues; patch.sigB = sigData; patch.signedBAt = now; }

  const contract = window._cur.contract;
  const bothSigned = (contract.signedAAt || (role === 'a' ? now : null)) && (contract.signedBAt || (role === 'b' ? now : null));
  patch.status = bothSigned ? 'signed' : 'partial';

  try {
    await store.update(id, patch);
    msg.className = 'msg show msg-ok';
    msg.textContent = 'امضای شما با موفقیت ثبت شد ✅';
    setTimeout(() => {
      location.hash = '#view?id=' + id;
    }, 1200);
  } catch (e) {
    msg.className = 'msg show msg-err';
    msg.textContent = 'خطا در ثبت: ' + e.message;
  }
}

/* ═══════════════════════════════════════════
   ۶. صفحه مشاهده و PDF
   ═══════════════════════════════════════════ */
async function renderView(id) {
  document.title = 'مشاهده قرارداد';
  document.getElementById('app').innerHTML = '<div class="container"><div class="card"><p>در حال بارگذاری...</p></div></div>';
  if (USE_SUPABASE && !sb) await new Promise(r => setTimeout(r, 800));

  let contract = null;
  try { contract = await store.get(id); } catch (e) {}
  if (!contract) {
    document.getElementById('app').innerHTML = '<div class="container"><div class="card"><p style="color:#c62828;">قرارداد یافت نشد.</p></div></div>';
    return;
  }

  const combined = { ...(contract.fixed || {}), ...(contract.valuesA || {}), ...(contract.valuesB || {}) };
  const stMap = { pending: 'در انتظار امضا', partial: 'نیمه‌امضا', signed: 'امضا شده' };
  const stCls = { pending: 'st-pending', partial: 'st-partial', signed: 'st-signed' };
  const html = renderTemplate(contract.template, combined, { sigA: contract.sigA, sigB: contract.sigB });

  const base = location.origin + location.pathname.replace(/index\.html$/, '').replace(/\/$/, '') + '/';

  document.getElementById('app').innerHTML = `
    <div class="container">
      <div class="card">
        <div class="header"><h1>📄 مشاهده قرارداد</h1></div>
        <p>وضعیت: <span class="status-badge ${stCls[contract.status] || 'st-pending'}">${stMap[contract.status] || contract.status}</span></p>
        <p style="font-size:0.85rem;color:#666;">
          طرف الف: ${contract.signedAAt ? '✅ امضا کرده' : '⏳ امضا نکرده'} &nbsp;|&nbsp;
          طرف ب: ${contract.signedBAt ? '✅ امضا کرده' : '⏳ امضا نکرده'}
        </p>
        <div class="contract-view">${html}</div>
        <div class="btn-row">
          <button class="btn" onclick="downloadPdf()">📥 دانلود PDF</button>
          ${contract.status !== 'signed' ? `
            <button class="btn btn-secondary" onclick="copyLink('${base}#sign?id=${id}&role=a')">📋 کپی لینک الف</button>
            <button class="btn btn-secondary" onclick="copyLink('${base}#sign?id=${id}&role=b')">📋 کپی لینک ب</button>
          ` : ''}
        </div>
        <div class="msg" id="vMsg"></div>
      </div>
    </div>
  `;
  window._view = { contract, combined };
}

function copyLink(url) {
  navigator.clipboard.writeText(url).then(() => {
    const m = document.getElementById('vMsg');
    m.className = 'msg show msg-ok';
    m.textContent = 'لینک کپی شد: ' + url;
  });
}

async function downloadPdf() {
  const { contract, combined } = window._view;
  const wrap = document.createElement('div');
  wrap.style.cssText = 'font-family: Tahoma, sans-serif; direction: rtl; padding: 25px; background: #fff; color: #111; line-height: 2.2; font-size: 13px; width: 210mm;';
  wrap.innerHTML = `
    <h2 style="text-align:center;color:#1a237e;font-size:15px;margin:0 0 15px;">قرارداد</h2>
    <div style="white-space:pre-wrap;">${renderTemplate(contract.template, combined, { sigA: contract.sigA, sigB: contract.sigB })}</div>
    <div style="margin-top:25px;border-top:1px dashed #ccc;padding-top:10px;font-size:10px;color:#666;text-align:center;">
      تاریخ چاپ: ${new Date().toLocaleString('fa-IR')} — شناسه: ${contract.id}
    </div>`;
  wrap.style.position = 'fixed';
  wrap.style.left = '-9999px';
  document.body.appendChild(wrap);

  try {
    await html2pdf().from(wrap).set({
      margin: 10,
      filename: `contract-${contract.id}.pdf`,
      image: { type: 'jpeg', quality: 0.95 },
      html2canvas: { scale: 2, useCORS: true },
      jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
    }).save();
  } catch (e) {
    alert('خطا در ساخت PDF: ' + e.message);
  } finally {
    wrap.remove();
  }
}

/* ═══════════════════════════════════════════
   ۷. مسیریابی
   ═══════════════════════════════════════════ */
function route() {
  const hash = location.hash || '';
  const [path, query] = hash.split('?');
  const p = new URLSearchParams(query || '');

  if (path === '#sign') {
    const id = p.get('id'), role = p.get('role');
    if (!id || !role || !['a', 'b'].includes(role)) {
      document.getElementById('app').innerHTML = '<div class="container"><div class="card"><p style="color:#c62828;">لینک نامعتبر است.</p></div></div>';
      return;
    }
    renderSign(id, role);
  } else if (path === '#view') {
    const id = p.get('id');
    if (!id) { location.hash = ''; return; }
    renderView(id);
  } else {
    renderAdmin();
  }
}

window.addEventListener('hashchange', route);
route();
</script>
